AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Helpfulness judges as NATIVE AgentCore llmAsAJudge evaluators. No Lambda.

  `Instructions` below are TRUNCATED for readability — generate the real ones with
  `native-judges plan` and paste, or use the CLI, which is the supported path.
  A rubric edit means regenerating them; they are a build artifact.

Parameters:
  JudgeModelId:
    Type: String
    Default: anthropic.claude-opus-4-5-20251101-v1:0
  SpanLogGroup:
    Type: String
    Default: /aws/bedrock-agentcore/runtimes/chatbot-DEFAULT
  ServiceName:
    Type: String
  EvaluationExecutionRoleArn:
    Type: String

Resources:
  SignalDensity:
    Type: AWS::BedrockAgentCore::Evaluator
    Properties:
      EvaluatorName: signal_density          # no hyphens: [a-zA-Z][a-zA-Z0-9_]{0,47}
      Level: TRACE
      EvaluatorConfig:
        LlmAsAJudge:
          Instructions: |
            <<< generated by native-judges plan — ~11,500 chars >>>
            The rubric with its output contract stripped and transcript markers
            re-pointed at {context} / {assistant_turn}.
          RatingScale:
            Numerical:
              - Label: hard_failure
                Value: 0.0
                Definition: A bright line named in the rubric was crossed. Absolute.
              - Label: warning
                Value: 0.5
                Definition: One or more checks failed, no bright line fired.
              - Label: pass
                Value: 1.0
                Definition: Every check passed, or there was nothing to get wrong.
          ModelConfig:
            BedrockEvaluatorModelConfig:
              ModelId: !Ref JudgeModelId
              InferenceConfig:
                MaxTokens: 8000
                Temperature: 0.0            # bound is [0,1] on this shape, not [0,2]
      Tags: {suite: helpfulness-judges, path: native}

  CriticalTier:
    Type: AWS::BedrockAgentCore::OnlineEvaluationConfig
    Properties:
      OnlineEvaluationConfigName: helpfulness_native_critical
      Rule:
        SamplingConfig: {SamplingPercentage: 100}
        SessionConfig: {SessionTimeoutMinutes: 30}
      DataSourceConfig:
        CloudWatchLogs:
          LogGroupNames: [!Ref SpanLogGroup]
          ServiceNames: [!Ref ServiceName]
      Evaluators:
        - EvaluatorId: !Ref SignalDensity
      EvaluationExecutionRoleArn: !Ref EvaluationExecutionRoleArn
      EnableOnCreate: false                 # backfill and inspect before going live
      Tags: {suite: helpfulness-judges, path: native}

Outputs:
  CriticalTierId:
    Value: !Ref CriticalTier
